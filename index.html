<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroLearn | OSN Astronomi Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- MathJax & Marked -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root { --glow-color: #0ea5e9; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-space { font-family: 'Space Grotesk', sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-text { text-shadow: 0 0 15px var(--glow-color); }
        .glow-border:hover {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            border-color: var(--glow-color);
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
        }
        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <div class="bg-grid"></div>

    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold font-space flex items-center gap-2 cursor-pointer" onclick="navigate('landing')">
            <span class="text-sky-400">✧</span> AstroLearn
        </div>
        <div id="nav-menu" class="space-x-4 text-sm font-medium flex items-center"></div>
    </nav>

    <!-- Main Content Container -->
    <main id="app" class="flex-grow w-full max-w-7xl mx-auto px-6 py-8"></main>

    <!-- Firebase SDK (Modular Version 10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc,
            collection,
            getDocs,
            addDoc,
            updateDoc,
            arrayUnion
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // === 1. KONFIGURASI FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyAlD1R_wQOztXC8g8c4BmF2Km3p9sDbFSk",
            authDomain: "astrolearn-app.firebaseapp.com",
            projectId: "astrolearn-app",
            storageBucket: "astrolearn-app.firebasestorage.app",
            messagingSenderId: "131107962381",
            appId: "1:131107962381:web:d7d28ff2609f938c29df44",
            measurementId: "G-1E5YNGGSYF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Global
        let currentUser = null;
        let userData = null;

        // Mock Data awal untuk Bank Soal (jika Firestore belum diisi)
        const mockQuestions = [
            {
                id: "q1",
                tahun: "2024",
                tingkat: "OSK",
                topik: "Mekanika Benda Langit",
                kesulitan: "Sedang",
                soal: "Sebuah planet bergerak mengelilingi Matahari dalam orbit elips. Jika jarak perihelionnya adalah $0.8\\text{ AU}$ dan aphelionnya adalah $1.2\\text{ AU}$, berapakah periode orbit planet tersebut?",
                kunci: "1.0 Tahun",
                pembahasan: "Sumbu semi-mayor $a = \\frac{r_p + r_a}{2} = \\frac{0.8 + 1.2}{2} = 1.0\\text{ AU}$. Menggunakan Hukum Kepler III ($P^2 = a^3$), diperoleh $P = 1.0\\text{ Tahun}$."
            },
            {
                id: "q2",
                tahun: "2025",
                tingkat: "Semifinal",
                topik: "Astrofisika & Fotometri",
                kesulitan: "Sulit",
                soal: "Hitung magnitudo mutlak sebuah bintang yang memiliki paralaks $0.05''$ dan magnitudo tampak $m = 8.5$!",
                kunci: "M = 6.99",
                pembahasan: "Jarak $d = \\frac{1}{p} = \\frac{1}{0.05} = 20\\text{ pc}$. Rumus Modulus Jarak: $m - M = 5 \\log d - 5 \\Rightarrow 8.5 - M = 5 \\log(20) - 5 \\Rightarrow M = 8.5 - 5(1.301) + 5 = 6.995$."
            }
        ];

        // === 2. MONITORING AUTH STATE ===
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    userData = userDoc.data();
                } else {
                    userData = { nama: user.email.split('@')[0], role: 'student', progress: 0, classes: [] };
                }
            } else {
                currentUser = null;
                userData = null;
            }
            updateNavbar();
            
            const currentPath = window.location.hash.replace('#', '');
            const protectedPages = ['dashboard', 'materi', 'drill', 'class', 'admin'];
            
            if (!currentUser && protectedPages.includes(currentPath)) {
                navigate('login');
            } else if (currentUser && (currentPath === 'login' || currentPath === 'register' || currentPath === 'landing' || currentPath === '')) {
                navigate('dashboard');
            } else {
                navigate(currentPath || 'landing');
            }
        });

        // === 3. ROUTER ===
        window.navigate = function(page) {
            window.location.hash = page;
            const container = document.getElementById('app');
            container.innerHTML = '';
            container.className = "flex-grow w-full max-w-7xl mx-auto px-6 py-8 fade-in";
            
            updateNavbar();

            if (!currentUser && ['dashboard', 'materi', 'drill', 'class', 'admin'].includes(page)) {
                renderLogin(container, "Silakan login terlebih dahulu.");
                return;
            }

            if (page === 'landing') renderLanding(container);
            else if (page === 'login') renderLogin(container);
            else if (page === 'register') renderRegister(container);
            else if (page === 'dashboard') renderDashboard(container);
            else if (page === 'materi') renderMateri(container);
            else if (page === 'drill') renderDrill(container);
            else if (page === 'class') renderClass(container);
            else if (page === 'admin') renderAdmin(container);
        };

        // === 4. NAVBAR ===
        function updateNavbar() {
            const nav = document.getElementById('nav-menu');
            if (currentUser) {
                const isAdmin = userData && userData.role === 'admin';
                nav.innerHTML = `
                    <button onclick="navigate('dashboard')" class="hover:text-sky-400 transition">Dashboard</button>
                    <button onclick="navigate('drill')" class="hover:text-sky-400 transition">Drill Soal</button>
                    <button onclick="navigate('class')" class="hover:text-sky-400 transition">Kelas</button>
                    ${isAdmin ? `<button onclick="navigate('admin')" class="px-3 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-lg hover:bg-amber-500/30 text-xs transition">⚙️ Management</button>` : ''}
                    <button onclick="handleLogout()" class="px-4 py-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/40 transition">Logout</button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="navigate('login')" class="hover:text-sky-400 transition">Masuk</button>
                    <button onclick="navigate('register')" class="px-5 py-2 bg-sky-500 text-white rounded-lg hover:bg-sky-400 shadow-[0_0_15px_rgba(14,165,233,0.5)] transition font-space">Daftar</button>
                `;
            }
        }

        // === 5. LANDING PAGE ===
        function renderLanding(container) {
            container.innerHTML = `
                <div class="text-center mt-20">
                    <h1 class="text-5xl md:text-7xl font-bold mb-6 glow-text tracking-tight">Kuasai Alam Semesta.</h1>
                    <p class="text-xl text-slate-400 mb-10 max-w-2xl mx-auto">Platform persiapan OSN Astronomi terlengkap. Pelajari konsep, pahami persamaan matematis, dan drill soal dari tingkat Kabupaten hingga OSN (2003-2026).</p>
                    <button onclick="navigate('${currentUser ? 'dashboard' : 'register'}')" class="px-8 py-4 bg-sky-500 text-white text-lg rounded-full hover:bg-sky-400 shadow-[0_0_20px_rgba(14,165,233,0.6)] transition-all transform hover:scale-105 font-space font-bold">
                        Mulai Penjelajahan 🚀
                    </button>
                </div>
            `;
        }

        // === 6. LOGIN PAGE ===
        function renderLogin(container, message = '') {
            container.innerHTML = `
                <div class="max-w-md mx-auto mt-12 glass p-8 rounded-2xl border-t border-sky-500/30">
                    <h2 class="text-3xl font-bold font-space mb-2 text-center">Masuk Akun</h2>
                    <p class="text-sm text-slate-400 text-center mb-6">Akses seluruh modul, drill soal, dan kelas</p>
                    ${message ? `<div class="mb-4 p-3 bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs rounded-lg">${message}</div>` : ''}
                    <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-300 text-xs rounded-lg"></div>
                    <form id="login-form" class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Email</label>
                            <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Password</label>
                            <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                        </div>
                        <button type="submit" id="btn-login" class="w-full bg-sky-500 text-white rounded-lg px-4 py-3 mt-4 hover:bg-sky-400 transition font-bold font-space shadow-lg shadow-sky-500/30">
                            Masuk Ke Sistem
                        </button>
                    </form>
                    <p class="text-xs text-slate-400 text-center mt-6">
                        Belum punya akun? <a href="#" onclick="navigate('register')" class="text-sky-400 hover:underline">Daftar sekarang</a>
                    </p>
                </div>
            `;

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const errorBox = document.getElementById('error-msg');
                const btn = document.getElementById('btn-login');

                try {
                    btn.innerText = "Memverifikasi...";
                    btn.disabled = true;
                    await signInWithEmailAndPassword(auth, email, password);
                    navigate('dashboard');
                } catch (err) {
                    errorBox.classList.remove('hidden');
                    errorBox.innerText = "Gagal login: Email atau password salah.";
                    btn.innerText = "Masuk Ke Sistem";
                    btn.disabled = false;
                }
            });
        }

        // === 7. REGISTER PAGE ===
        function renderRegister(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto mt-8 glass p-8 rounded-2xl border-t border-sky-500/30">
                    <h2 class="text-3xl font-bold font-space mb-2 text-center">Buat Akun Baru</h2>
                    <p class="text-sm text-slate-400 text-center mb-6">Bergabunglah dalam komunitas AstroLearn</p>
                    <div id="reg-error-msg" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-300 text-xs rounded-lg"></div>
                    <form id="register-form" class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Nama Lengkap</label>
                            <input type="text" id="reg-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Email</label>
                            <input type="email" id="reg-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Password (Minimal 6 Karakter)</label>
                            <input type="password" id="reg-password" minlength="6" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                        </div>
                        <button type="submit" id="btn-register" class="w-full bg-sky-500 text-white rounded-lg px-4 py-3 mt-4 hover:bg-sky-400 transition font-bold font-space shadow-lg shadow-sky-500/30">
                            Daftar Akun
                        </button>
                    </form>
                    <p class="text-xs text-slate-400 text-center mt-6">
                        Sudah punya akun? <a href="#" onclick="navigate('login')" class="text-sky-400 hover:underline">Masuk di sini</a>
                    </p>
                </div>
            `;

            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('reg-name').value;
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                const errorBox = document.getElementById('reg-error-msg');
                const btn = document.getElementById('btn-register');

                try {
                    btn.innerText = "Mendaftarkan...";
                    btn.disabled = true;
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    
                    const newUserData = {
                        nama: name,
                        email: email,
                        role: "student",
                        progress: 0,
                        joinedClasses: [],
                        createdAt: new Date().toISOString()
                    };

                    await setDoc(doc(db, "users", res.user.uid), newUserData);
                    userData = newUserData;
                    navigate('dashboard');
                } catch (err) {
                    errorBox.classList.remove('hidden');
                    errorBox.innerText = "Gagal mendaftar: " + err.message;
                    btn.innerText = "Daftar Akun";
                    btn.disabled = false;
                }
            });
        }

        window.handleLogout = async function() {
            await signOut(auth);
            navigate('landing');
        };

        // === 8. DASHBOARD PAGE ===
        function renderDashboard(container) {
            const namaUser = userData ? userData.nama : (currentUser ? currentUser.email : "Komandan");
            const progressVal = userData && userData.progress ? userData.progress : 0;

            container.innerHTML = `
                <div class="mb-8">
                    <h2 class="text-3xl font-bold font-space mb-2">Selamat Datang, ${namaUser}. 👋</h2>
                    <p class="text-slate-400">Pilih misi pembelajaran astronomimu hari ini.</p>
                </div>

                <!-- Main Grid Options -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                    <!-- Card 1: Materi -->
                    <div onclick="navigate('materi')" class="glass p-6 rounded-2xl glow-border cursor-pointer transition-all flex flex-col justify-between border border-slate-700">
                        <div>
                            <div class="w-12 h-12 bg-sky-500/20 text-sky-400 rounded-xl flex items-center justify-center text-2xl mb-4">📚</div>
                            <h3 class="text-xl font-bold mb-2">Belajar Materi</h3>
                            <p class="text-sm text-slate-400 mb-4">Eksplorasi konsep Astronomi Posisi, Astrofisika, Mekanika Benda Langit, dan Kosmologi.</p>
                        </div>
                        <div class="bg-slate-800/80 rounded-lg p-3">
                            <div class="flex justify-between items-center text-xs mb-1">
                                <span class="text-slate-400">Progres Belajar:</span>
                                <span class="text-sky-400 font-bold">${progressVal}%</span>
                            </div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div class="bg-sky-400 h-full" style="width: ${progressVal}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2: Drill Soal (Aktif) -->
                    <div onclick="navigate('drill')" class="glass p-6 rounded-2xl glow-border cursor-pointer transition-all flex flex-col justify-between border border-slate-700">
                        <div>
                            <div class="w-12 h-12 bg-purple-500/20 text-purple-400 rounded-xl flex items-center justify-center text-2xl mb-4">🎯</div>
                            <h3 class="text-xl font-bold mb-2">Drill Soal OSN</h3>
                            <p class="text-sm text-slate-400 mb-4">Koleksi soal OSK, OSP, Semifinal, & OSN (2003-2026). Fitur Custom Practice & Exam Mode.</p>
                        </div>
                        <div class="text-sm font-semibold text-purple-400 flex items-center gap-1">
                            Mulai Latihan <span class="text-lg">&rarr;</span>
                        </div>
                    </div>

                    <!-- Card 3: Kontes -->
                    <div class="glass p-6 rounded-2xl border border-slate-700 relative overflow-hidden opacity-80 cursor-not-allowed">
                        <div class="absolute inset-0 bg-slate-900/70 z-10 flex items-center justify-center">
                            <span class="px-3 py-1 bg-slate-800 text-xs font-bold rounded-full border border-slate-600 text-amber-400">SEGERA HADIR</span>
                        </div>
                        <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center text-2xl mb-4">🏆</div>
                        <h3 class="text-xl font-bold mb-2">Kontes Real-time</h3>
                        <p class="text-sm text-slate-400">Uji kemampuan simulasi ujian secara serentak dengan peserta se-Indonesia.</p>
                    </div>
                </div>

                <!-- Section Bawah: Menu CLASS -->
                <div class="glass p-8 rounded-2xl border border-sky-500/30">
                    <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                        <div>
                            <div class="flex items-center gap-2 text-sky-400 font-bold mb-1">
                                <span>🏫</span> AstroLearn Class
                            </div>
                            <h3 class="text-2xl font-bold font-space">Gabung Kelas Bimbingan</h3>
                            <p class="text-sm text-slate-400 mt-1 max-w-xl">Punya kode kelas dari guru atau pengajar OSN-mu? Masukkan kode di sini untuk mengakses materi khusus, tugas, dan latihan terpilih.</p>
                        </div>
                        <div class="w-full md:w-auto flex flex-col sm:flex-row gap-3">
                            <input type="text" id="join-class-code" placeholder="Masukkan Kode Kelas" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl text-white uppercase tracking-wider focus:outline-none focus:border-sky-500">
                            <button onclick="handleJoinClass()" class="bg-sky-500 hover:bg-sky-400 text-white font-bold font-space px-6 py-3 rounded-xl transition whitespace-nowrap shadow-lg shadow-sky-500/20">
                                Gabung Kelas
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleJoinClass = async function() {
            const codeInput = document.getElementById('join-class-code');
            const code = codeInput ? codeInput.value.trim().toUpperCase() : '';
            if (!code) return alert("Sertakan kode kelas terlebih dahulu.");

            try {
                if (currentUser) {
                    const userRef = doc(db, "users", currentUser.uid);
                    await updateDoc(userRef, {
                        joinedClasses: arrayUnion(code)
                    });
                }
                alert(`Berhasil bergabung ke dalam kelas: ${code}`);
                navigate('class');
            } catch (e) {
                alert("Gagal bergabung ke kelas. Silakan periksa kembali kodenya.");
            }
        };

        // === 9. DRILL SOAL (BANK SOAL & CUSTOM PRACTICE) ===
        function renderDrill(container) {
            container.innerHTML = `
                <div class="mb-8">
                    <h2 class="text-3xl font-bold font-space mb-2">Drill Soal OSN Astronomi</h2>
                    <p class="text-slate-400">Pilih mode latihan, sesuaikan tingkat kesulitan, dan akses pembahasan mendalam.</p>
                </div>

                <!-- Custom Filter Bar -->
                <div class="glass p-6 rounded-2xl border border-slate-700 mb-8 space-y-4">
                    <h3 class="text-sm font-bold text-sky-400 uppercase tracking-wider mb-2">🔍 Filter & Custom Drill</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Tingkat Lomba</label>
                            <select id="filter-tingkat" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
                                <option value="Semua">Semua Tingkat</option>
                                <option value="OSK">OSK (Kabupaten)</option>
                                <option value="OSP">OSP (Provinsi)</option>
                                <option value="Semifinal">Semifinal OSN</option>
                                <option value="OSN">OSN (Nasional)</option>
                                <option value="Latihan">Latihan Tambahan</option>
                                <option value="Lomba">Lomba Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Tahun (2003 - 2026)</label>
                            <select id="filter-tahun" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
                                <option value="Semua">Semua Tahun</option>
                                ${generateYearOptions()}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Materi / Topik</label>
                            <select id="filter-topik" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
                                <option value="Semua">Semua Topik</option>
                                <option value="Mekanika Benda Langit">Mekanika Benda Langit</option>
                                <option value="Astrofisika & Fotometri">Astrofisika & Fotometri</option>
                                <option value="Astronomi Posisi">Astronomi Posisi</option>
                                <option value="Kosmologi">Kosmologi</option>
                                <option value="Instrumen Astronomi">Instrumen Astronomi</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Tingkat Kesulitan</label>
                            <select id="filter-kesulitan" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2.5 text-white">
                                <option value="Semua">Semua Level</option>
                                <option value="Mudah">Mudah</option>
                                <option value="Sedang">Sedang</option>
                                <option value="Sulit">Sulit</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-2">
                        <button onclick="loadFilteredQuestions()" class="bg-sky-500 hover:bg-sky-400 text-white font-bold px-5 py-2 rounded-lg text-sm transition">
                            Terapkan Filter
                        </button>
                    </div>
                </div>

                <!-- Soal Container -->
                <div id="questions-list" class="space-y-6">
                    <p class="text-slate-400">Memuat bank soal...</p>
                </div>
            `;

            loadFilteredQuestions();
        }

        function generateYearOptions() {
            let options = '';
            for (let y = 2026; y >= 2003; y--) {
                options += `<option value="${y}">${y}</option>`;
            }
            return options;
        }

        window.loadFilteredQuestions = function() {
            const container = document.getElementById('questions-list');
            if (!container) return;

            const tkt = document.getElementById('filter-tingkat')?.value || 'Semua';
            const thn = document.getElementById('filter-tahun')?.value || 'Semua';
            const tpk = document.getElementById('filter-topik')?.value || 'Semua';
            const ksl = document.getElementById('filter-kesulitan')?.value || 'Semua';

            let filtered = mockQuestions.filter(q => {
                if (tkt !== 'Semua' && q.tingkat !== tkt) return false;
                if (thn !== 'Semua' && q.tahun !== thn) return false;
                if (tpk !== 'Semua' && q.topik !== tpk) return false;
                if (ksl !== 'Semua' && q.kesulitan !== ksl) return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass p-8 rounded-2xl text-center border border-slate-700">
                        <p class="text-slate-400 mb-2">Tidak ditemukan soal yang cocok dengan filter ini.</p>
                        <p class="text-xs text-slate-500">Cobalah mengubah kriteria tahun atau tingkat lomba.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((q, idx) => `
                <div class="glass p-6 rounded-2xl border border-slate-700 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 bg-sky-500/20 text-sky-400 text-xs font-bold rounded-md border border-sky-500/30">${q.tingkat} ${q.tahun}</span>
                            <span class="px-2.5 py-1 bg-purple-500/20 text-purple-300 text-xs font-medium rounded-md">${q.topik}</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded border border-slate-600 ${q.kesulitan === 'Sulit' ? 'text-red-400' : q.kesulitan === 'Sedang' ? 'text-amber-400' : 'text-emerald-400'}">
                            Level: ${q.kesulitan}
                        </span>
                    </div>

                    <div class="text-slate-200 text-sm leading-relaxed">
                        <p><strong>Soal ${idx + 1}:</strong> ${q.soal}</p>
                    </div>

                    <div class="pt-2 flex flex-wrap gap-3">
                        <button onclick="toggleElement('ans-${q.id}')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg transition border border-slate-700">
                            👁️ Lihat Kunci & Pembahasan
                        </button>
                    </div>

                    <div id="ans-${q.id}" class="hidden mt-4 p-4 bg-slate-900/90 rounded-xl border border-sky-500/30 space-y-2 text-xs">
                        <div class="font-bold text-sky-400">Kunci Jawaban: ${q.kunci}</div>
                        <div class="text-slate-300"><strong>Pembahasan:</strong> ${q.pembahasan}</div>
                    </div>
                </div>
            `).join('');

            if (window.MathJax) {
                MathJax.typesetPromise([container]);
            }
        };

        window.toggleElement = function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        };

        // === 10. HALAMAN KELAS (CLASS PAGE) ===
        function renderClass(container) {
            const joined = userData && userData.joinedClasses ? userData.joinedClasses : [];

            container.innerHTML = `
                <div class="mb-8 flex justify-between items-center">
                    <div>
                        <h2 class="text-3xl font-bold font-space mb-2">Kelas Bimbingan Saya</h2>
                        <p class="text-slate-400">Daftar kelas aktif dan materi instruktur.</p>
                    </div>
                </div>

                ${joined.length === 0 ? `
                    <div class="glass p-12 rounded-2xl text-center border border-slate-700 max-w-xl mx-auto">
                        <div class="text-4xl mb-4">🏫</div>
                        <h3 class="text-xl font-bold mb-2">Belum Bergabung ke Kelas</h3>
                        <p class="text-sm text-slate-400 mb-6">Kamu belum terdaftar di kelas manapun. Masukkan kode kelas dari pengajar di bawah untuk memulai.</p>
                        <div class="flex gap-2 justify-center">
                            <input type="text" id="inner-class-code" placeholder="Kode Kelas (misal: ASTRO-1)" class="bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-lg text-sm text-white uppercase">
                            <button onclick="handleJoinInnerClass()" class="bg-sky-500 hover:bg-sky-400 text-white font-bold px-4 py-2.5 rounded-lg text-sm">Masuk</button>
                        </div>
                    </div>
                ` : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${joined.map(cls => `
                            <div class="glass p-6 rounded-2xl border border-sky-500/30">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <span class="text-xs bg-sky-500/20 text-sky-400 px-2 py-1 rounded font-mono">${cls}</span>
                                        <h3 class="text-xl font-bold mt-2">Kelas Pembinaan OSN Astronomi</h3>
                                    </div>
                                    <span class="text-xs text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded border border-emerald-500/30">Aktif</span>
                                </div>
                                <p class="text-sm text-slate-400 mb-6">Materi khusus persiapan OSN, tugas harian, dan evaluasi mingguan.</p>
                                <div class="space-y-2 border-t border-slate-800 pt-4 text-xs text-slate-300">
                                    <div class="flex justify-between"><span>📚 Modul Tambahan:</span> <span class="font-semibold text-white">3 File</span></div>
                                    <div class="flex justify-between"><span>📝 Tugas Aktif:</span> <span class="font-semibold text-sky-400">1 Latihan Soal</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `}
            `;
        }

        window.handleJoinInnerClass = function() {
            const val = document.getElementById('inner-class-code')?.value;
            if (val) {
                document.getElementById('join-class-code') ? document.getElementById('join-class-code').value = val : null;
                handleJoinClass();
            }
        };

        // === 11. HALAMAN MATERI ===
        function renderMateri(container) {
            container.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8">
                    <aside class="w-full md:w-64 flex-shrink-0">
                        <button onclick="navigate('dashboard')" class="text-sm text-slate-400 hover:text-white mb-6 flex items-center gap-2">&larr; Kembali</button>
                        <div id="sidebar-container" class="glass p-4 rounded-xl sticky top-24 h-[80vh] overflow-y-auto hidden-scrollbar">
                            <p class="text-sm text-slate-400">Memuat daftar materi...</p>
                        </div>
                    </aside>

                    <article id="materi-content" class="flex-grow glass p-8 rounded-2xl border border-slate-700 relative">
                        <p class="text-slate-400">Pilih materi di sebelah kiri untuk mulai belajar.</p>
                    </article>
                </div>
            `;

            loadSidebarMateri();
            bukaMateri('astronomi-paralaks');
        }

        async function loadSidebarMateri() {
            try {
                const response = await fetch('/materi/list.json');
                const data = await response.json();
                
                let sidebarHTML = '';
                data.forEach(topic => {
                    sidebarHTML += `<div class="mb-6">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">${topic.kategori}</h4>
                        <ul class="space-y-2">`;
                    topic.materi.forEach(item => {
                        sidebarHTML += `
                            <li id="menu-${item.id}" onclick="bukaMateri('${item.id}')" 
                                class="materi-item text-slate-400 hover:text-white hover:bg-white/5 border-l-2 border-transparent px-3 py-2 cursor-pointer text-sm transition rounded-r-lg">
                                ${item.judul}
                            </li>`;
                    });
                    sidebarHTML += `</ul></div>`;
                });
                
                document.getElementById('sidebar-container').innerHTML = sidebarHTML;
            } catch (error) {
                document.getElementById('sidebar-container').innerHTML = `<p class="text-slate-400 text-xs">Menu Silabus Standar</p>`;
            }
        }

        window.bukaMateri = async function(materiId) {
            const container = document.getElementById('materi-content');
            if (!container) return;
            container.innerHTML = `<p class="text-slate-400 animate-pulse">Memuat materi...</p>`;

            try {
                const response = await fetch(`/materi/${materiId}.md`);
                if (!response.ok) throw new Error("File tidak ditemukan");
                
                const markdownText = await response.text();
                const htmlContent = marked.parse(markdownText);
                
                container.innerHTML = htmlContent;
                if (window.MathJax) MathJax.typesetPromise([container]);
            } catch (err) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-amber-400 text-lg font-bold mb-2">🚧 Modul Paralaks & Astronomi</p>
                        <p class="text-slate-400 text-sm">Gunakan editor di Management Panel untuk menyusun materi ini.</p>
                    </div>`;
            }
        };

        // === 12. ADMIN / MANAGEMENT PANEL (AKUN MANAGEMENT) ===
        function renderAdmin(container) {
            container.innerHTML = `
                <div class="mb-8">
                    <div class="flex items-center gap-2 text-amber-400 font-bold mb-1">
                        <span>⚙️</span> Management Panel
                    </div>
                    <h2 class="text-3xl font-bold font-space">Input & Kelola Konten</h2>
                    <p class="text-slate-400">Tambahkan soal baru, kunci jawaban, pembahasan, dan materi pembelajaran.</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Form Input Soal Baru -->
                    <div class="glass p-6 rounded-2xl border border-slate-700">
                        <h3 class="text-lg font-bold font-space mb-4 text-sky-400">+ Tambah Soal OSN Baru</h3>
                        <form id="add-question-form" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Tingkat</label>
                                    <select id="input-tingkat" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                                        <option value="OSK">OSK</option>
                                        <option value="OSP">OSP</option>
                                        <option value="Semifinal">Semifinal</option>
                                        <option value="OSN">OSN</option>
                                        <option value="Latihan">Latihan Tambahan</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Tahun</label>
                                    <input type="number" id="input-tahun" value="2026" min="2003" max="2026" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Topik / Materi</label>
                                    <select id="input-topik" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                                        <option value="Mekanika Benda Langit">Mekanika Benda Langit</option>
                                        <option value="Astrofisika & Fotometri">Astrofisika & Fotometri</option>
                                        <option value="Astronomi Posisi">Astronomi Posisi</option>
                                        <option value="Kosmologi">Kosmologi</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Kesulitan</label>
                                    <select id="input-kesulitan" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                                        <option value="Mudah">Mudah</option>
                                        <option value="Sedang">Sedang</option>
                                        <option value="Sulit">Sulit</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Teks Soal (Dukungan LaTeX $...$)</label>
                                <textarea id="input-soal" rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white" placeholder="Tuliskan soal di sini..."></textarea>
                            </div>

                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Kunci Jawaban Singkat</label>
                                <input type="text" id="input-kunci" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white" placeholder="Misal: Jawaban B / 12.5 AU">
                            </div>

                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Pembahasan Lengkap</label>
                                <textarea id="input-pembahasan" rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-white" placeholder="Langkah penyelesaian..."></textarea>
                            </div>

                            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold p-3 rounded-lg text-xs font-space">
                                Simpan Soal ke Bank Data
                            </button>
                        </form>
                    </div>

                    <!-- Quick Tools Management -->
                    <div class="space-y-6">
                        <div class="glass p-6 rounded-2xl border border-slate-700">
                            <h3 class="text-lg font-bold font-space mb-2 text-amber-400">🔑 Buat Kode Kelas Baru</h3>
                            <p class="text-xs text-slate-400 mb-4">Buat kelas khusus untuk grup siswa atau bimbingan OSN.</p>
                            <div class="flex gap-2">
                                <input type="text" id="new-class-code" placeholder="Kode Kelas (Misal: INTENSIF-2026)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white uppercase flex-grow">
                                <button onclick="createClassCode()" class="bg-amber-500 hover:bg-amber-400 text-white font-bold px-4 py-2 rounded-lg text-xs">Buat</button>
                            </div>
                        </div>

                        <div class="glass p-6 rounded-2xl border border-slate-700">
                            <h3 class="text-lg font-bold font-space mb-2">📊 Informasi Bank Soal</h3>
                            <div class="text-xs text-slate-300 space-y-2">
                                <div class="flex justify-between py-1 border-b border-slate-800">
                                    <span>Total Soal Terdaftar:</span>
                                    <span class="font-bold text-sky-400" id="total-q-count">2 Soal</span>
                                </div>
                                <div class="flex justify-between py-1 border-b border-slate-800">
                                    <span>Cakupan Tahun:</span>
                                    <span class="font-bold text-sky-400">2003 - 2026</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('add-question-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const newQ = {
                    id: 'q_' + Date.now(),
                    tingkat: document.getElementById('input-tingkat').value,
                    tahun: document.getElementById('input-tahun').value,
                    topik: document.getElementById('input-topik').value,
                    kesulitan: document.getElementById('input-kesulitan').value,
                    soal: document.getElementById('input-soal').value,
                    kunci: document.getElementById('input-kunci').value,
                    pembahasan: document.getElementById('input-pembahasan').value
                };

                mockQuestions.unshift(newQ);
                alert("Soal berhasil ditambahkan ke bank soal!");
                e.target.reset();
                document.getElementById('total-q-count').innerText = mockQuestions.length + " Soal";
            });
        }

        window.createClassCode = function() {
            const code = document.getElementById('new-class-code')?.value;
            if (code) {
                alert(`Kode kelas "${code.toUpperCase()}" berhasil dibuat! Siswa sekarang dapat bergabung menggunakan kode ini.`);
                document.getElementById('new-class-code').value = '';
            }
        };
    </script>
</body>
</html>
